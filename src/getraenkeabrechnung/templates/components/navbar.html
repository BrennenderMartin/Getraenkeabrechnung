<div class="navbar bg-base-200 shadow-sm">
        <div class="flex-1">
            <a class="btn btn-ghost text-base sm:text-xl" href="{{ url_for("reset_cookie") }}">
                {{ event_name }} 
                {% if name %}
                    <span class="text-gray-500 text-xs sm:text-base font-medium ml-1">- {{ name }}</span>
                    <span id="total_price" class="text-gray-500 text-xs sm:text-base font-normal"> ({{ total_price }}€)</span>
                {% endif %}
            </a>
        </div>
        <div class="flex-none">
            <ul class="menu menu-horizontal px-1">
            {% if name %}
                <a class="btn" href="{{ url_for("settings", name=name) }}">Einstellungen</a>
            {% endif %}
            </ul>
        </div>
</div>
