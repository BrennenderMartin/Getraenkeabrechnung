<div class="card bg-base-100 image-full w-96 shadow-sm">
    <figure>
        <img class="h-48 w-96 object-fill" src="{{ get_image_for_drink(drink) }}" alt="{{ drink }}" />
    </figure>
    <div class="card-body">
        <div class="card-actions justify-end">
            <form method="post" action="{{ url_for('return_drink_route', name=name, drink=drink) }}">
                <button class="btn btn-primary" type="submit">{{ drink }}</button>
            </form>
        </div>
    </div>
</div>
